name: Build JustBot ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "JustBot UCI version/date (example: 20260920)"
        required: true
        default: "20260920"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build justbot-linux-aarch64-neon
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set UCI engine name
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          uci_date = os.environ["UCI_DATE"]

          old = 'println!("id name JustBot {}", env!("CARGO_PKG_VERSION"));'

          matches = []

          for path in Path(".").rglob("*.rs"):
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              if old in text:
                  matches.append(path)

          if len(matches) == 0:
              raise SystemExit(
                  "ERROR: Could not find the JustBot UCI name line."
              )

          if len(matches) > 1:
              raise SystemExit(
                  f"ERROR: Found the UCI name line in multiple files: {matches}"
              )

          path = matches[0]
          text = path.read_text()

          new = f'println!("id name JustBot {{}}", "{uci_date}");'

          text = text.replace(old, new, 1)
          path.write_text(text)

          print(f"Modified file: {path}")
          print(f"UCI engine name: JustBot {uci_date}")
          PY

          echo "Modified UCI line:"
          grep -R 'id name JustBot' --include='*.rs' .

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build ARM64 NEON
        env:
          RUSTFLAGS: "-C target-cpu=generic -C target-feature=+neon,+crt-static"
        run: |
          cargo build \
            --release \
            --target aarch64-unknown-linux-musl

      - name: Rename binary
        run: |
          mv \
            target/aarch64-unknown-linux-musl/release/justbot \
            justbot-linux-aarch64-neon

      - name: Verify binary
        run: |
          file justbot-linux-aarch64-neon
          ls -lh justbot-linux-aarch64-neon

          echo "Checking UCI identification:"
          printf "uci\nquit\n" | ./justbot-linux-aarch64-neon

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: justbot-linux-aarch64-neon
          path: justbot-linux-aarch64-neon
          retention-days: 1
