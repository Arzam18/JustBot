name: Build JustBot ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "JustBot UCI version/date (example: 20260915)"
        required: true
        default: "20260915"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build justbot-linux-aarch64-neon
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set UCI engine name
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("src/uci.rs")
          text = path.read_text()

          old = 'println!("id name JustBot {}", env!("CARGO_PKG_VERSION"));'
          new = f'println!("id name JustBot {{}}", "{os.environ["UCI_DATE"]}");'

          if old not in text:
              raise SystemExit(
                  "ERROR: Could not find the expected UCI name line in src/uci.rs"
              )

          text = text.replace(old, new, 1)
          path.write_text(text)

          print(f"UCI engine name set to: JustBot {os.environ['UCI_DATE']}")
          PY

          echo "Checking modified UCI line:"
          grep 'id name JustBot' src/uci.rs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build ARM64 NEON
        env:
          RUSTFLAGS: "-C target-cpu=generic -C target-feature=+neon,+crt-static"
        run: |
          cargo build \
            --release \
            --target aarch64-unknown-linux-musl

      - name: Rename binary
        run: |
          mv \
            target/aarch64-unknown-linux-musl/release/justbot \
            justbot-linux-aarch64-neon

      - name: Verify binary
        run: |
          file justbot-linux-aarch64-neon
          ls -lh justbot-linux-aarch64-neon

          echo "Checking UCI identification:"
          printf "uci\nquit\n" | ./justbot-linux-aarch64-neon

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: justbot-linux-aarch64-neon
          path: justbot-linux-aarch64-neon
          retention-days: 1
