
name: Build JustBot ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "JustBot UCI version/date (example: 20260924)"
        required: true
        default: "20261002"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build justbot-linux-aarch64-neon
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set UCI engine version
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("build.rs")
          source = path.read_text()

          pattern = r'fn set_engine_version\(\) \{.*?\n\}'

          replacement = '''fn set_engine_version() {
              let version = env::var("UCI_DATE")
                  .unwrap_or_else(|_| env!("CARGO_PKG_VERSION").to_string());

              println!("cargo::rustc-env=ENGINE_VERSION={version}");
              println!("cargo::rerun-if-env-changed=UCI_DATE");
          }'''

          updated, count = re.subn(
              pattern,
              lambda _: replacement,
              source,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not locate set_engine_version() in build.rs"
              )

          path.write_text(updated)

          print("Updated build.rs successfully.")
          print(f"UCI engine name: JustBot {os.environ['UCI_DATE']}")
          PY

          grep -A7 'fn set_engine_version' build.rs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build ARM64 NEON
        env:
          RUSTFLAGS: "-C target-cpu=generic -C target-feature=+neon,+crt-static"
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          cargo build \
            --release \
            --target aarch64-unknown-linux-musl

      - name: Rename binary
        run: |
          mv \
            target/aarch64-unknown-linux-musl/release/justbot \
            justbot-linux-aarch64-neon

      - name: Verify binary and UCI name
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          set -euo pipefail

          file justbot-linux-aarch64-neon
          ls -lh justbot-linux-aarch64-neon

          echo "Checking UCI identification:"

          printf "uci\nquit\n" | ./justbot-linux-aarch64-neon | tee uci-output.txt

          grep -Fx "id name JustBot $UCI_DATE" uci-output.txt

          echo "UCI identification verified successfully."

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: justbot-linux-aarch64-neon
          path: justbot-linux-aarch64-neon
          retention-days: 1
